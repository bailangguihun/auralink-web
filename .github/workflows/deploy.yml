name: Deploy to Production

on:
  push:
    branches:
      - release

permissions:
  contents: read

jobs:
  package:
    if: vars.R25_WEB_ARTIFACT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      artifact_attempt: ${{ steps.pack.outputs.artifact_attempt }}
      build_id: ${{ steps.pack.outputs.build_id }}
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
      public_build_manifest_sha256: ${{ steps.pack.outputs.public_build_manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Build the approved release source
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.artlive.top
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/release
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --no-audit --no-fund
          npm run build
      - name: Package the standalone release
        id: pack
        run: |
          set -Eeuo pipefail
          python3 -B scripts/package-web-release.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/web-release"
          printf 'artifact_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/web-release/web-release.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          with open(sys.argv[1]) as stream:
              metadata = json.load(stream)
          for field in ("build_id", "archive_sha256", "public_build_manifest_sha256"):
              print(f"{field}={metadata[field]}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-release/
          if-no-files-found: error
          compression-level: 0

  publish-artifact:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    timeout-minutes: 35
    env:
      WEB_ARTIFACT_ATTEMPT: ${{ needs.package.outputs.artifact_attempt }}
      WEB_BUILD_ID: ${{ needs.package.outputs.build_id }}
      WEB_ARCHIVE_SHA256: ${{ needs.package.outputs.archive_sha256 }}
      WEB_PUBLIC_BUILD_SHA256: ${{ needs.package.outputs.public_build_manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-release-${{ github.run_id }}-${{ needs.package.outputs.artifact_attempt }}
          path: ${{ runner.temp }}/web-release
      - name: Push the verified release and invoke the installed R25 publisher
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ vars.SERVER_HOST_KEY }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/release
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$WEB_ARTIFACT_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$WEB_BUILD_ID" =~ ^[A-Za-z0-9._-]{1,80}$ && "$WEB_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SERVER_PORT" =~ ^[1-9][0-9]{0,4}$ && "$SERVER_HOST_KEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,2}$ ]]
          test -n "$SERVER_SSH_KEY"

          umask 077
          key_dir=$(mktemp -d "$RUNNER_TEMP/r25-web-ssh.XXXXXX")
          trap 'rm -f -- "$key_dir/key" "$key_dir/known_hosts"; rmdir -- "$key_dir"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$key_dir/key"
          known_host="$SERVER_HOST"
          if [ "$SERVER_PORT" != 22 ]; then
            known_host="[$SERVER_HOST]:$SERVER_PORT"
          fi
          printf '%s %s\n' "$known_host" "$SERVER_HOST_KEY" > "$key_dir/known_hosts"
          unset SERVER_SSH_KEY
          options=(-i "$key_dir/key" -o "UserKnownHostsFile=$key_dir/known_hosts" -o StrictHostKeyChecking=yes
                   -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          destination="$SERVER_USER@$SERVER_HOST"
          remote=(ssh "${options[@]}" -p "$SERVER_PORT" "$destination")
          root=/root/autodl-tmp/auralink-web-deploy
          publisher="$root/bin/deploy-web.sh"
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID-$WEB_ARTIFACT_ATTEMPT"
          archive="$RUNNER_TEMP/web-release/web.tar.gz"
          require_current_release() {
            local latest
            if ! latest=$(timeout 15 git ls-remote --exit-code origin refs/heads/release | cut -f1) ||
                [ "$latest" != "$GITHUB_SHA" ]; then
              echo 'The expected commit is no longer the confirmed Web release tip.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          }
          require_current_release
          if ! prepared=$(timeout 40 "${remote[@]}" "$publisher prepare-independent-artifact $release_id") ||
              [ "$prepared" != 'DEPLOY_WEB=INDEPENDENT_INCOMING_READY' ]; then
            printf '%s\n' "$prepared"
            echo 'R25 could not prepare an independent Web release. Check the installed publisher and Core controller.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          transfer_started=$SECONDS
          if ! python3 -B scripts/transfer_web_release.py --archive "$archive" --release "$release_id" \
              --sha256 "$WEB_ARCHIVE_SHA256" --destination "$destination" --port "$SERVER_PORT" \
              --identity "$key_dir/key" --known-hosts "$key_dir/known_hosts"; then
            echo 'Web release transfer failed. Publication has not started.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Web archive transfer and checksum verified in $((SECONDS - transfer_started))s (artifact attempt $WEB_ARTIFACT_ATTEMPT)." >> "$GITHUB_STEP_SUMMARY"
          publish_started=$SECONDS
          deadline=$((SECONDS + 180))
          while true; do
            require_current_release
            if result=$("${remote[@]}" "timeout --signal=TERM --kill-after=90 540 $publisher deploy-independent-artifact $release_id $WEB_ARCHIVE_SHA256 $WEB_BUILD_ID" 2>&1); then
              printf '%s\n' "$result"
              if grep -Fxq "DEPLOY_WEB=ARTIFACT_COMMITTED commit=$GITHUB_SHA build=$WEB_BUILD_ID" <<< "$result" ||
                  grep -Fxq "DEPLOY_WEB=ARTIFACT_CURRENT commit=$GITHUB_SHA build=$WEB_BUILD_ID" <<< "$result"; then
                break
              fi
              echo 'Web publication receipt could not be verified. Inspect the R25 transition.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            else
              rc=$?
              printf '%s\n' "$result"
              if [ "$rc" -ne 65 ] || [ "$result" != 'DEPLOY_WEB=REFUSED reason=frontend_deployment_busy' ]; then
                if [ "$rc" -eq 1 ] && grep -Eq '^DEPLOY_WEB=ROLLBACK_OK reason=[a-z_]+$' <<< "$result"; then
                  stage=$(sed -n 's/^DEPLOY_WEB=RECONCILIATION_REQUIRED stage=//p' <<< "$result")
                  if [[ "$stage" =~ ^"$root"/runtime/frontend-selection-transition-[0-9]{18,20}$ ]] &&
                      "${remote[@]}" "$publisher recover-selection $stage"; then
                    echo 'Web publication failed. R25 verified and retained the previous release.' >> "$GITHUB_STEP_SUMMARY"
                    exit "$rc"
                  fi
                fi
                echo 'Web publication failed or has an unknown outcome. Inspect the R25 transition.' >> "$GITHUB_STEP_SUMMARY"
                exit "$rc"
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo 'Web publication timed out waiting for the R25 shared lease.' >> "$GITHUB_STEP_SUMMARY"
                exit "$rc"
              fi
              sleep $((2 + RANDOM % 4))
            fi
          done
          echo "R25 publication and receipt verified in $((SECONDS - publish_started))s, including lease wait." >> "$GITHUB_STEP_SUMMARY"

          handoff_root=/root/autodl-tmp/artlive-r25-native-pg16/handoff-production-20260923T062101Z
          supervisor="R25_ROOT=$handoff_root ARTLIVE_R25_HANDOFF_CONFIG=$handoff_root/runtime/handoff-control.env $handoff_root/operations/r25-production-app-supervisor.sh status"
          deadline=$((SECONDS + 90))
          while true; do
            rc=0
            result=$(timeout 40 "${remote[@]}" "$supervisor" 2>&1) || rc=$?
            printf '%s\n' "$result"
            if [ "$rc" -eq 0 ] && grep -Fxq 'R25_PRODUCTION_APP_SUPERVISOR=RUNNING' <<< "$result"; then
              echo 'R25 application supervision verified.' >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [ "$rc" -ne 76 ] || [ "$SECONDS" -ge "$deadline" ]; then
              echo 'Web publication receipt verified. R25 application supervision could not be verified.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep $((2 + RANDOM % 4))
          done
      - name: Verify public Web, build marker and API
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$WEB_BUILD_ID" =~ ^[A-Za-z0-9._-]{1,80}$ && "$WEB_PUBLIC_BUILD_SHA256" =~ ^[a-f0-9]{64}$ ]]
          options=(--fail --silent --show-error --connect-timeout 5 --max-time 12 --retry 2 --retry-all-errors --retry-max-time 35)
          if curl "${options[@]}" --output /dev/null https://artlive.top/ &&
              curl "${options[@]}" --output "$RUNNER_TEMP/web-build-marker.js" "https://artlive.top/_next/static/$WEB_BUILD_ID/_buildManifest.js" &&
              printf '%s  %s\n' "$WEB_PUBLIC_BUILD_SHA256" "$RUNNER_TEMP/web-build-marker.js" | sha256sum --check &&
              curl "${options[@]}" https://api.artlive.top/api/health |
                python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin).get("status") == "UP" else 1)'; then
            echo "Web $GITHUB_SHA ($WEB_BUILD_ID) verified by R25 and public checks." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Web publication receipt verified. Public checks failed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  deploy:
    if: vars.R25_WEB_ARTIFACT_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    timeout-minutes: 15

    steps:
      - name: Deploy verified release to production
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -Eeuo pipefail

            expected_sha="${{ github.sha }}"
            staging_dir=/root/autodl-tmp/auralink-github-staging/auralink-web
            deploy_helper=/root/autodl-tmp/auralink-web-deploy/bin/deploy-web.sh
            deploy_lock=/root/autodl-tmp/auralink-web-deploy/runtime/frontend-deployment.lock

            if ! staging_prefix="$(git -C "$staging_dir" rev-parse --show-prefix)" || [ -n "$staging_prefix" ]; then
              echo "Web staging directory is not a Git repository" >&2
              exit 1
            fi

            if [ ! -x "$deploy_helper" ]; then
              echo "Web deployment helper is not executable" >&2
              exit 1
            fi

            if [ -L "$deploy_lock" ]; then
              echo "Web deployment lock must not be a symbolic link" >&2
              exit 1
            fi
            if [ ! -e "$deploy_lock" ]; then
              install -m 600 /dev/null "$deploy_lock"
            fi
            if [ "$(id -u)" -eq 0 ]; then
              chown root:root "$deploy_lock"
            fi
            chmod 600 "$deploy_lock"

            (
              # AutoDL's root-owned environment is scoped to Git download only.
              # Production SSH runs as root; -O verifies the executing identity.
              network_turbo=/etc/network_turbo
              if [ -L "$network_turbo" ] || [ ! -f "$network_turbo" ] || \
                [ ! -r "$network_turbo" ] || [ ! -O "$network_turbo" ]; then
                echo "AutoDL Git download environment is missing or unsafe" >&2
                exit 1
              fi
              if ! network_turbo_mode="$(stat -c '%a' -- "$network_turbo")" || \
                [[ ! "$network_turbo_mode" =~ ^[0-7]{3,4}$ ]] || \
                (( (8#$network_turbo_mode & 0022) != 0 )); then
                echo "AutoDL Git download environment permissions are unsafe" >&2
                exit 1
              fi
              if ! source "$network_turbo" >/dev/null 2>&1; then
                echo "AutoDL Git download environment could not be loaded" >&2
                exit 1
              fi

              fetch_ok=0
              for attempt in 1 2 3; do
                echo "Fetching release branch: attempt ${attempt}/3"
                if timeout 60 git -c http.version=HTTP/1.1 \
                  -C "$staging_dir" \
                  fetch --no-tags origin release
                then
                  fetch_ok=1
                  break
                fi

                if [ "$attempt" -lt 3 ]; then
                  sleep $((attempt * 5))
                fi
              done

              if [ "$fetch_ok" -ne 1 ]; then
                echo "Failed to fetch release after 3 attempts" >&2
                exit 1
              fi
            )

            fetched_sha="$(git -C "$staging_dir" rev-parse --verify 'FETCH_HEAD^{commit}')"
            if [ "$fetched_sha" != "$expected_sha" ]; then
              echo "Release changed while this deployment was queued; refusing to deploy $expected_sha (fetched $fetched_sha)" >&2
              exit 1
            fi

            "$deploy_helper" deploy "$expected_sha"
